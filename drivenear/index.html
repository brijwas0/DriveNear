<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DriveNear — Rent a car from people near you</title>
<meta name="description" content="DriveNear is a peer-to-peer car rental marketplace in India. Rent trusted cars from nearby owners, or list your own car and earn.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT:'#0E7C5A', dark:'#0A5C43', light:'#E4F3ED', ink:'#083D2D' },
          ink: '#181C1A',
          muted: '#6B7570',
          sand: '#FAF9F5',
          line: '#E7E4DC',
          amber: { DEFAULT:'#F5A623', light:'#FDF1DC' },
          danger: { DEFAULT:'#E5484D', light:'#FCE7E7' },
        },
        fontFamily: {
          display: ['"Space Grotesk"','sans-serif'],
          body: ['"Inter"','sans-serif'],
        },
        boxShadow: {
          card: '0 1px 2px rgba(24,28,26,0.04), 0 8px 24px -8px rgba(24,28,26,0.10)',
          lift: '0 20px 40px -12px rgba(24,28,26,0.22)',
        },
        borderRadius: { '2xl':'1.25rem', '3xl':'1.75rem' }
      }
    }
  }
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-sand text-ink antialiased">

<div id="app"></div>

<!-- ============ Data ============ -->
<script src="js/data/mockData.js"></script>

<!-- ============ Utils ============ -->
<script src="js/utils/icons.js"></script>
<script src="js/utils/vehicleValidator.js"></script>
<script src="js/utils/cityAutocomplete.js"></script>

<!-- ============ Core state / routing ============ -->
<script src="js/state.js"></script>
<script src="js/router.js"></script>

<!-- ============ Firebase SDK & Backend Adapter ============ -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/firebase-backend.js"></script>

<!-- ============ Shared components ============ -->
<script src="js/components/toast.js"></script>
<script src="js/components/navbar.js"></script>
<script src="js/components/footer.js"></script>
<script src="js/components/bottomNav.js"></script>
<script src="js/components/carCard.js"></script>
<script src="js/components/skeleton.js"></script>
<script src="js/components/emptyState.js"></script>
<script src="js/components/calendar.js"></script>
<script src="js/components/bookingModal.js"></script>
<script src="js/components/authModal.js"></script>

<!-- ============ Pages ============ -->
<script src="js/pages/home.js"></script>
<script src="js/pages/howItWorks.js"></script>
<script src="js/pages/safety.js"></script>
<script src="js/pages/cars.js"></script>
<script src="js/pages/carDetails.js"></script>
<script src="js/pages/listYourCar.js"></script>
<script src="js/pages/ownerDashboard.js"></script>
<script src="js/pages/adminDashboard.js"></script>
<script src="js/pages/dashboard.js"></script>
<script src="js/pages/saved.js"></script>
<script src="js/pages/profile.js"></script>
<script src="js/pages/messages.js"></script>

<!-- ============ App shell / router mount (must load last) ============ -->
<script src="js/app.js"></script>

</body>
</html>
